<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カレンダーメモ</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

<div class="container">
  <header>
    <h1>カレンダーメモ</h1>
    <div class="header-actions">
      <button class="btn btn-success" id="toggle-add-panel" style="display: none;">+ 予定を追加</button>
      <button class="btn btn-primary" id="login-btn" style="display: none;">Googleでログイン</button>
      <button class="btn" id="logout-btn" style="display: none;">ログアウト</button>
      <button class="btn" id="toggle-settings">設定</button>
    </div>
  </header>

  <!-- 表示フィルターバー -->
  <div class="filter-bar">
    <span style="font-weight: 600; color: var(--text-sub);">カレンダー:</span>
    <select id="calendar-select" class="status-select" style="max-width: 220px;">
      <option value="primary">メイン (primary)</option>
    </select>
    <span style="font-weight: 600; color: var(--text-sub); margin-left: 10px;">表示設定:</span>
    <label class="switch-label">
      <input type="checkbox" id="show-done-toggle" checked>
      <span>[完了] を表示</span>
    </label>
    <label class="switch-label">
      <input type="checkbox" id="show-cancel-toggle" checked>
      <span>[中止] を表示</span>
    </label>
  </div>

  <!-- 予定作成パネル -->
  <div class="panel" id="add-panel">
    <div class="panel-title">新しい予定を作成</div>
    <div class="form-group">
      <label for="event-summary">タイトル</label>
      <input type="text" id="event-summary" placeholder="予定のタイトル">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="event-location">場所 / URL</label>
        <input type="text" id="event-location" placeholder="場所 または https://...">
      </div>
      <div class="form-group">
        <label for="event-status">ステータス</label>
        <select id="event-status">
          <option value="">未完了</option>
          <option value="7">進行中</option>
          <option value="8">完了</option>
          <option value="4">中止</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label for="event-start">開始日時</label>
        <input type="datetime-local" id="event-start">
      </div>
      <div class="form-group">
        <label for="event-end">終了日時</label>
        <input type="datetime-local" id="event-end">
      </div>
    </div>
    <div class="form-group">
      <label for="event-description">詳細 / メモ（`- [ ] タスク` と書くとチェックボックスになります）</label>
      <textarea id="event-description" placeholder="- [ ] 持ち物の準備&#10;- [x] チケットの購入"></textarea>
    </div>
    <button class="btn btn-success" id="create-event-btn">予定を保存</button>
    <div class="error-message" id="add-error-msg"></div>
  </div>

  <!-- 設定画面 -->
  <div class="panel" id="settings-panel">
    <div class="panel-title">設定</div>
    <div class="form-group">
      <label for="client-id">OAuth 2.0 Client ID</label>
      <input type="text" id="client-id" placeholder="xxxx.apps.googleusercontent.com">
    </div>
    <div class="form-group">
      <label for="calendar-id">カレンダー ID (自分のメインカレンダーなら primary)</label>
      <input type="text" id="calendar-id" value="primary" placeholder="primary または xxx@group.calendar.google.com">
    </div>
    
    <div class="form-row">
      <div class="form-group">
        <label for="fetch-days-before">何日前から取得</label>
        <input type="number" id="fetch-days-before" value="7" min="0">
      </div>
      <div class="form-group">
        <label for="fetch-days-after">何日後まで取得</label>
        <input type="number" id="fetch-days-after" value="0" min="0">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="max-results">最大取得件数</label>
        <input type="number" id="max-results" value="50" min="1" max="250">
      </div>
    </div>
    <button class="btn btn-primary" id="save-settings">保存</button>
    <div class="error-message" id="settings-error-msg"></div>
  </div>

  <!-- カレンダーイベント表示エリア -->
  <div id="events-container">
    <div class="empty-state">初期化中...</div>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
